services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nami-routing-demo
    ports:
      - '8000:8080' # Map host port 8000 to uvicorn port 8080
    environment:
      - DEMO_AUTH_BYPASS=true
      - PYTHONPATH=/app/src:/app/src/backend
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
